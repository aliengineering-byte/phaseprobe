name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-only:
    name: core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not scipy"
      - run: python -m phaseprobe --version
      - run: python -m phaseprobe scan --example logistic-negative

  scipy-extra:
    name: scipy / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,scipy]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src tests
      - run: python -m pytest --cov=phaseprobe --cov-report=term
      - run: python -m phaseprobe perturb --example scipy-lorenz-negative
      - run: python -m phaseprobe check --example scipy-predator-prey

  package-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_package.py
      - run: >-
          python scripts/verify_artifacts.py
          --dist-dir dist
          --work-root "${RUNNER_TEMP}/phaseprobe artifact gate"
      - run: python scripts/check_links.py
      - run: python scripts/hygiene.py
      - uses: actions/upload-artifact@v4
        with:
          name: phaseprobe-packages
          path: dist/*
          if-no-files-found: error

  windows-artifact-install:
    name: artifact install / windows / Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_package.py
      - run: >-
          python scripts/verify_artifacts.py
          --dist-dir dist
          --work-root "$env:RUNNER_TEMP\phaseprobe artifact gate"
