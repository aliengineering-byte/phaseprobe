name: Tagged release validation

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-tagged-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_package.py
      - run: >-
          python scripts/verify_artifacts.py
          --dist-dir dist
          --work-root "${RUNNER_TEMP}/phaseprobe tagged artifact gate"
      - run: python scripts/hygiene.py
      - uses: actions/upload-artifact@v4
        with:
          name: phaseprobe-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
